---
name: CI

"on":
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 20 is the supported floor; 22 exercises live streaming and CDP
        # attach mode (global WebSocket client).
        node-version: [20, 22]
    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # No later step runs authenticated git; don't leave the token in
          # the checkout for repository-controlled test code to read.
          persist-credentials: false
      - name: Set up Node.js
        # v4.0.3
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate plugin manifest
        run: node scripts/check-manifest.mjs
